apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aspecta-demo-default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aspecta-demo-allow-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aspecta-demo
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aspecta-demo-allow-frontend-to-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aspecta-demo
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aspecta-demo
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 5000

