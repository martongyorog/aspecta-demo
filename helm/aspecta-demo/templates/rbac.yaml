apiVersion: v1
kind: ServiceAccount
metadata:
  name: aspecta-demo-frontend
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aspecta-demo-backend
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aspecta-demo-readonly
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aspecta-demo-readonly
subjects:
  - kind: Group
    name: aspecta-demo-viewers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: aspecta-demo-readonly
  apiGroup: rbac.authorization.k8s.io

